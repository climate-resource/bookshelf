[project]
name = "bookshelf"
version = "1.1.0"
description = "Python SDK for the Bookshelf data platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Climate Resource" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = [
    "filelock>=3.15",
    "httpx>=0.27,<1",
    "pandas>=2.3",
    "pydantic>=2.7",
    "platformdirs>=4",
    "pyarrow>=18",
    "pyyaml>=6.0.2",
    "typer>=0.26",
]

[project.urls]
Homepage = "https://github.com/climate-resource/bookshelf"
Documentation = "https://climate-resource.github.io/bookshelf/latest/"
Source = "https://github.com/climate-resource/bookshelf"
Changelog = "https://climate-resource.github.io/bookshelf/latest/changelog/"
Issues = "https://github.com/climate-resource/bookshelf/issues"

[project.scripts]
bookshelf = "bookshelf._cli:main"

[project.optional-dependencies]
scmrun = ["scmdata>=0.18"]
figures = ["matplotlib>=3.10", "seaborn>=0.13"]
publish = [
    "gitpython>=3.1",
    "nbconvert>=7.3",
    "nbformat>=5.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookshelf"]

[tool.hatch.build.targets.sdist]
only-include = ["src/bookshelf", "openapi.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live Bookshelf deployment, selected by BOOKSHELF_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = [
    "E501",
    "B008",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["bookshelf"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "nbconvert.*",
    "nbformat.*",
    "pandas",
    "pandas.*",
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pandas-stubs>=2.2",
]
test = [
    "pytest>=8",
    "pytest-cov>=6",
    "pyyaml>=6.0.2",
    "types-PyYAML>=6.0",
    "typer>=0.26",
    "polars>=1.8",
    "matplotlib>=3.10",
]
codegen = [
    "datamodel-code-generator==0.68.1",
    "ruff==0.15.0",
]

[tool.coverage.run]
source = ["src/bookshelf"]
branch = true

[tool.coverage.report]
# Kept in step with the root pyproject.toml, which governs a run started from the repository root.
# A run from either directory measures the same tree against the same gate.
fail_under = 80
skip_empty = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]
