[project]
name = "bookshelf"
version = "0.2.1.dev1"
description = "Async Python client for the Bookshelf Platform API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "keyring>=25",
    "pydantic>=2.7",
    "platformdirs>=4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
bookshelf = "bookshelf._cli:main"

[project.optional-dependencies]
dataframes = ["polars>=1.0", "pandas>=2.2", "pyarrow>=16"]
scmrun = ["scmdata>=0.18"]
publish = [
    "papermill>=2.5",
    "nbconvert>=7.0",
    "jupyter-client>=8.0",
    "ipykernel>=6.0",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "keyring>=25",
    "typer>=0.12",
    "bookshelf-api",
    "aiosqlite>=0.20",
    "pandas>=2.2",
    "pyarrow>=16",
]

[tool.uv.sources]
bookshelf-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookshelf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["bookshelf", "bookshelf_api"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "keyring.*",
    "papermill.*",
    "nbconvert.*",
    "nbformat.*",
    "pandas",
    "pandas.*",
    "ipykernel.*",
    "jupyter_client.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pandas-stubs>=2.2",
]
codegen = [
    "datamodel-code-generator==0.68.1",
    "ruff==0.15.0",
]

[tool.coverage.run]
source = ["src/bookshelf"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
