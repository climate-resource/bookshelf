[project]
name = "bookshelf"
version = "1.0.0b1"
description = "Python SDK for the Bookshelf data platform"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "gitpython>=3.1",
    "httpx>=0.27",
    "keyring>=25",
    "pydantic>=2.7",
    "platformdirs>=4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
bookshelf = "bookshelf._cli:main"

[project.optional-dependencies]
dataframes = [
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
]
scmrun = ["scmdata>=0.18"]
publish = [
    "nbconvert>=7.0",
    "nbformat>=5.0",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "keyring>=25",
    "typer>=0.12",
    "pandas>=2.2",
    "pyarrow>=16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookshelf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a live Bookshelf deployment, selected by BOOKSHELF_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = [
    "E501",
    "B008",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["bookshelf"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "keyring.*",
    "nbconvert.*",
    "nbformat.*",
    "pandas",
    "pandas.*",
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pandas-stubs>=2.2",
]
codegen = [
    "datamodel-code-generator==0.68.1",
    "ruff==0.15.0",
]

[tool.coverage.run]
source = ["src/bookshelf"]
branch = true

[tool.coverage.report]
# Kept in step with the root pyproject.toml, which governs a run started from the repository root.
# A run from either directory measures the same tree against the same gate.
fail_under = 80
skip_empty = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]
