name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  BOOKSHELF_DOWNLOAD_CACHE_LOCATION: /tmp/pooch

jobs:
  linting:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      PRE_COMMIT_HOME: /tmp/.cache/pre-commit
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: /tmp/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit
      - name: mypy
        run: |
          (cd packages/bookshelf && uv run --locked --all-extras mypy src)
          # Runs ruff, uv lock and various sanity checks
          uv run pre-commit run --all-files

  docs:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: docs
        run: |
          make docs-strict
      - name: docs-with-changelog
        run: |
          # Check CHANGELOG will build too
          uv run towncrier build --yes
          uv run mkdocs build --strict
          # Just in case, undo the staged changes
          git restore --staged . && git restore .

  imports-without-extras:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest" ]
        python-version:
          - "3.12"
          - "3.13"
    runs-on: "${{ matrix.os }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Check importable without extras
        run: uv run --python ${{ matrix.python-version }} --no-dev python scripts/test-install.py

  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Run SDK tests
        run: |
          uv run --python ${{ matrix.python-version }} --locked \
            --package bookshelf --all-extras \
            pytest packages/bookshelf -r a -v

  sdk-generated-models:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Regenerate SDK models
        run: |
          uv run --project packages/bookshelf --locked --group codegen \
            python packages/bookshelf/scripts/generate_models.py
          git diff --exit-code -- packages/bookshelf/src/bookshelf/_generated
          test -z "$(git ls-files --others --exclude-standard \
            packages/bookshelf/src/bookshelf/_generated)"

  check-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check build
        run: |
          uv build --package bookshelf -o dist
          tar -tvf dist/bookshelf-*.tar.gz --wildcards '*bookshelf/py.typed'
