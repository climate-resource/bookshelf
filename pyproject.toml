[project]
name = "bookshelf-root"
version = "1.0.0b2"
description = "A collection of curated climate data sets"
readme = "README.md"
authors = [
    { name = "Jared Lewis", email = "jared.lewis@climate-resource.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bookshelf[dataframes,scmrun]",
]

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.11.1",
    "pytest-xdist>=3.3.1",
    "mypy>=1.2.0",
    "ruff==0.15.0",
    "pre-commit>=3.3.1",
    "towncrier>=23.6.0",
    "liccheck>=0.9.1",
    # Stubs
    "types-pyyaml>=6.0.12.20240917",
    "pandas-stubs>=2.2.3.241009",
    # Docs
    "mkdocs>=1.6.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-section-index>=0.3.9",
    "mkdocs-literate-nav>=0.6.1",
    "mkdocs-autorefs>=1.0.1",
    "mkdocs-jupyter>=0.24.0",
    # Backs ScmRun.lineplot() in the how-to guides.
    "seaborn>=0.13",
    "mike>=2.1.3",
    "mkdocs-minify-plugin>=0.8.0",
    "setuptools<81",
    "pip>=26.1.2",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bookshelf = { workspace = true }

[tool.coverage.run]
# The library, not the tests that exercise it.
# Kept in step with packages/bookshelf/pyproject.toml, which governs a run started from that directory.
source = ["packages/bookshelf/src"]
branch = true

[tool.coverage.report]
fail_under = 80
skip_empty = true
show_missing = true
# Regexes for lines to exclude from consideration in addition to the defaults
exclude_also = [
    # Don't complain about missing type checking code:
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]

[tool.mypy]
strict = true
# prevent unimported libraries silently being treated as Any
#disallow_any_unimported = true
# show error codes on failure with context
show_error_codes = true
show_error_context = true
# warn if code can't be reached
warn_unreachable = true
# importing following uses default settings
follow_imports = "normal"
exclude = [
    "build",
    "dist",
    "notebooks",
    "scripts",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[tool.towncrier]
package = "bookshelf"
package_dir = "packages/bookshelf/src"
filename = "docs/changelog.md"
directory = "changelog/"
title_format = "## bookshelf {version} ({project_date})"
underlines = ["", "", ""]
issue_format = "[#{issue}](https://github.com/climate-resource/bookshelf/pull/{issue})"

  [[tool.towncrier.type]]
  directory = "breaking"
  name = "Breaking Changes"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "deprecation"
  name = "Deprecations"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "feature"
  name = "Features"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "improvement"
  name = "Improvements"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "fix"
  name = "Bug Fixes"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "docs"
  name = "Improved Documentation"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "trivial"
  name = "Trivial/Internal Changes"
  showcontent = false

[tool.liccheck]
authorized_licenses = [
    "bsd",
    "bsd license",
    "BSD 3-Clause",
    "BSD-3-Clause",
    "CC0",
    "apache",
    "apache 2.0",
    "apache software",
    "apache software license",
    "Apache License, Version 2.0",
    "Apache-2.0",
    "Historical Permission Notice and Disclaimer (HPND)",
    "isc license",
    "isc license (iscl)",
    "gnu lgpl",
    "lgpl with exceptions or zpl",
    "LGPLv2+",
    "GNU Lesser General Public License v2 (LGPLv2)",
    "GNU Lesser General Public License v2 or later (LGPLv2+)",
    "mit",
    "mit license",
    "Mozilla Public License 2.0 (MPL 2.0)",
    "python software foundation",
    "python software foundation license",
    "PSF-2.0",
    "zpl 2.1",
]
# This starting list is relatively conservative. Depending on the project, it
# may make sense to move some of these into the authorized list
unauthorized_licenses = [
    "agpl",
    "gnu agpl",
    "gpl v3",
    "gplv3",
    "gpl v2",
    "gplv2",
    "gpl v1",
    "gplv1",
]
