name: hadcrut
edition: 2
license: OGL v3
description: |
  HadCRUT5 is a gridded dataset of global historical surface temperature anomalies relative to a 1961-1990
  reference period. Data are available for each month from January 1850 onwards.
cite_as: |
  Morice, C.P., J.J. Kennedy, N.A. Rayner, J.P. Winn, E. Hogan, R.E. Killick, R.J.H. Dunn, T.J. Osborn,
  P.D. Jones and I.R. Simpson (in press) An updated assessment of near-surface temperature change from
  1850: the HadCRUT5 dataset. Journal of Geophysical Research (Atmospheres) doi:10.1029/2019JD032361
